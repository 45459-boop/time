<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全屏时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    width:100vw;
    height:100vh;
    /*本地图片，把背景图和html放在同一个文件夹，图片命名 bg.png*/
    background: url('bg.png') center/cover no-repeat;
    overflow:hidden;
    position:relative;
}
/* 蓝框：时间区域 */
.time-box{
    position:absolute;
    width:100%;
    top:30%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}
#time{
    font-size:clamp(150px,30vw,250px);
    color:#600c0c;
    font-weight:900;
    letter-spacing:2px;
    line-height:1;
}
#dateWeek{
    font-size:clamp(20px,2.4vw,28px);
    color:#480a0a;
    margin-top:15px;
}
/* 绿框：语录定位截图绿色方框位置 */
.quote-area{
    position:absolute;
    width:100%;
    top:84%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}
#dailyQuote{
    font-family:"STXingkai","华文行楷","KaiTi","楷体",serif;
    font-size:clamp(28px,3.6vw,38px);
    color:#ffffff;
    letter-spacing:6px;
    text-shadow:0 3px 8px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
<div class="time-box">
    <div id="time">00:00:00</div>
    <div id="dateWeek"></div>
</div>
<div class="quote-area">
    <div id="dailyQuote"></div>
</div>

<script>
const quoteList = [
"追风赶月莫停留，平芜尽处是春山。",
"且将新火试新茶，诗酒趁年华。",
"凡心所向，素履所往，生如逆旅，一苇以航。",
"愿你遍历山河，仍觉人间值得。",
"前路浩浩荡荡，万事尽可期待。",
"保持热爱，奔赴山海。",
"星光不问赶路人，时光不负有心人。",
"慢慢来，谁还没有一个努力的过程。",
"风遇山止，船到岸停，万事皆有归期。",
"行而不辍，未来可期。",
"生活原本沉闷，但跑起来就有风。",
"愿所有的奔赴，都有回响。",
"山高水长，怕什么来不及。",
"心怀热烈，静候花开。",
"日有小暖，岁有小安。"
];

function getTodayQuote(){
    const day = new Date().getDate();
    return quoteList[day % quoteList.length];
}

function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,"0");
    const m = String(now.getMinutes()).padStart(2,"0");
    const s = String(now.getSeconds()).padStart(2,"0");
    document.getElementById("time").innerText = `${h}:${m}:${s}`;

    const weekArr=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
    const Y=now.getFullYear();
    const M=now.getMonth()+1;
    const D=now.getDate();
    const W=weekArr[now.getDay()];
    document.getElementById("dateWeek").innerText = `${Y}年${M}月${D}日 ${W}`;
}

document.getElementById("dailyQuote").innerText = getTodayQuote();
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
